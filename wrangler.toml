name = "svr-cf"
main = "src/index.js"
compatibility_date = "2026-10-23"
# Example (production-only) routes:
# routes = [{ pattern = "your-domain.example/*", zone_name = "example" }]

 # The following configuration unconditionally invokes the Worker script at
 # `src/index.ts`, which can programatically fetch assets via the ASSETS binding
[assets]
directory = "./public/"
binding = "ASSETS"
run_worker_first = true

[dev]
port = 8787

# Note: Do not set secrets in code. For local dev, use `.dev.vars`.

[[kv_namespaces]]
binding = "SVR_KV"
# Placeholder IDs work for local dev; set real IDs after creating KV in Cloudflare.
# For production, use a separate local-only config (e.g., wrangler.production.toml).
id = "CHANGEME"

[[d1_databases]]
binding = "SVR_DB"
database_name = "svr-db"
database_id = "CHANGEME"

# Per-IP limit for unauthenticated auth steps, per-user limit for signed-in writes.
# namespace_id is any account-unique integer string.
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Workers Logs: keep console output and errors from every request in the dashboard.
[observability]
enabled = true
